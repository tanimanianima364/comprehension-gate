name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # POSIX only, but two POSIX hosts: macOS differs from Linux in the places
    # these tests lean on -- BSD grep, a deep and symlinked temp directory, a
    # file system that refuses names that are not valid UTF-8, and a git that
    # ships with Xcode rather than with the distribution.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
